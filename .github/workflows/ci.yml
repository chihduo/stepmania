name: Windows portable build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Build, smoke test, and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build, test, and create portable archive
        shell: pwsh
        run: ./ci/Invoke-WindowsPortablePipeline.ps1

      - name: Upload portable build
        uses: actions/upload-artifact@v6
        with:
          name: StepMania-windows-x64-${{ github.run_number }}.${{ github.run_attempt }}
          path: |
            out/StepMania-5.1-windows-x64-portable.zip
            out/StepMania-5.1-windows-x64-portable.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
