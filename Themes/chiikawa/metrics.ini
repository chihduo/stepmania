[Global]
FallbackTheme=default

[Background]
FallbackMovie="/Themes/chiikawa/Movies/ddr-trio-loop.mp4"

[ScreenTitleMenu]
LogoX=SCREEN_WIDTH*0.25
LogoY=SCREEN_HEIGHT*0.30
ScrollerX=SCREEN_WIDTH*0.25
ScrollerY=SCREEN_CENTER_Y+118

[ScreenReplayBrowser]
ShowHeader=false
ShowFooter=false
ReplayBackdropOnCommand=visible,false
ReplayTitleOnCommand=diffuse,color("#4a3c40");shadowlength,0
ReplayListOnCommand=x,SCREEN_WIDTH*0.32;maxwidth,SCREEN_WIDTH*0.52/0.85;diffuse,color("#4a3c40");shadowlength,0
ReplayHelpOnCommand=diffuse,color("#796970");shadowlength,0
