[Global]
FallbackTheme=default

[Background]
FallbackMovie="/Themes/chiikawa/Movies/ddr-trio-loop.mp4"

[ScreenTitleMenu]
LogoX=SCREEN_WIDTH*0.25
LogoY=SCREEN_HEIGHT*0.30
ScrollerX=SCREEN_WIDTH*0.25
ScrollerY=SCREEN_CENTER_Y+118

[ScreenReplayBrowser]
ShowHeader=false
ShowFooter=false
ReplayBackdropOnCommand=visible,false
ReplayTitleOnCommand=diffuse,color("#4a3c40");shadowlength,0
ReplayListOnCommand=x,SCREEN_WIDTH*0.32;maxwidth,SCREEN_WIDTH*0.52/0.85;diffuse,color("#4a3c40");shadowlength,0
ReplayHelpOnCommand=diffuse,color("#796970");shadowlength,0

[ScreenDashboardUpload]
ShowHeader=false
ShowFooter=false
DashboardBackdropOnCommand=diffuse,color("#fff8ed")
DashboardTitleOnCommand=diffuse,color("#4a3c40");shadowlength,0
DashboardStatusOnCommand=shadowlength,2;shadowcolor,color("#684b4740")
DashboardStatusProgressCommand=diffuse,color("#2c7593")
DashboardStatusSuccessCommand=diffuse,color("#347a61")
DashboardStatusWarningCommand=diffuse,color("#98601d")
DashboardStatusErrorCommand=diffuse,color("#b13e60")
DashboardDetailsOnCommand=diffuse,color("#4a3c40");shadowlength,0
DashboardActionOnCommand=shadowlength,1;shadowcolor,color("#684b4740")
DashboardActionGainFocusCommand=diffuse,color("#A3375C")
DashboardActionLoseFocusCommand=diffuse,color("#512232")
DashboardHelpOnCommand=diffuse,color("#796970");shadowlength,0
